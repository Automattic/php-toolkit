# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["trunk"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to publish the generated Pages branch.
permissions:
  contents: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish landing branch
        env:
          CUSTOM_DOMAIN: pushmd.blog
          SOURCE_DIR: plugins/push-md/docs/landing
          TARGET_BRANCH: gh-pages
        shell: bash
        run: |
          set -euo pipefail

          publish_dir="${RUNNER_TEMP}/push-md-pages"
          rm -rf "$publish_dir"
          mkdir -p "$publish_dir"

          cp -R "${SOURCE_DIR}/." "$publish_dir/"
          find "$publish_dir" -name .DS_Store -type f -delete
          printf '%s\n' "$CUSTOM_DOMAIN" > "$publish_dir/CNAME"
          touch "$publish_dir/.nojekyll"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git fetch origin "$TARGET_BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${TARGET_BRANCH}"; then
            git switch --force-create "$TARGET_BRANCH" "origin/${TARGET_BRANCH}"
          else
            git switch --orphan "$TARGET_BRANCH"
          fi

          git rm -r --ignore-unmatch .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "${publish_dir}/." .

          git add -A
          if git diff --cached --quiet; then
            echo "Pages branch already up to date."
            exit 0
          fi

          git commit -m "Deploy Push MD landing ${GITHUB_SHA}"
          git push origin "HEAD:${TARGET_BRANCH}"
